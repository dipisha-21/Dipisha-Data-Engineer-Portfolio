kind = "web"
previewPath = "/"
title = "Dipisha Shivangi — Data Engineer"
description = "A recruiter-ready Data Engineer portfolio with verified evidence, selected projects, a privacy-safe resume download, and a source-grounded virtual ambassador."
version = "1.0.0"
id = "artifacts/dipisha-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21710

[services.development]
run = "pnpm --filter @workspace/dipisha-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dipisha-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/dipisha-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21710"
BASE_PATH = "/"
