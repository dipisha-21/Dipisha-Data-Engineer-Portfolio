openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ambassador
    description: Source-grounded recruiter questions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ambassador/starters:
    get:
      operationId: getAmbassadorStarters
      tags: [ambassador]
      summary: Recruiter-focused starter questions
      responses:
        "200":
          description: Questions with relevant on-page sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmbassadorStarter"
  /ambassador/ask:
    post:
      operationId: askAmbassador
      tags: [ambassador]
      summary: Ask a question about verified resume evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmbassadorQuestionInput"
      responses:
        "200":
          description: Evidence-grounded response or explicit unsupported answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorAnswer"
        "400":
          description: Invalid question
        "429":
          description: Too many requests
        "503":
          description: Model temporarily unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AmbassadorStarter:
      type: object
      required: [question, href]
      properties:
        question:
          type: string
        href:
          type: string
    AmbassadorQuestionInput:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 500
    AmbassadorCitation:
      type: object
      required: [label, href]
      properties:
        label:
          type: string
        href:
          type: string
    AmbassadorAnswer:
      type: object
      required: [answer, citations, unsupported]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AmbassadorCitation"
        unsupported:
          type: boolean

